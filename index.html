<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b0d12" />
<title>DabzChat — Chat App</title>
<style>
  /* ---------- Base ---------- */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel-2: #1a1f2b;
    --panel-3: #222938;
    --line: #242b38;
    --text: #e9edf5;
    --muted: #8b95a8;
    --brand-1: #6c5ce7;
    --brand-2: #00d2ff;
    --online: #2ecc71;
  }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 8% -10%, #1d2444 0%, transparent 60%),
      radial-gradient(700px 500px at 110% 110%, #102a3a 0%, transparent 55%),
      var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- App shell ---------- */
  .app {
    width: min(1120px, 100%);
    height: min(780px, calc(100dvh - 40px));
    display: flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 320px;
    flex: 0 0 320px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #12151d 0%, #0f1219 100%);
    border-right: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 18px 14px;
  }

  .logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
    box-shadow: 0 8px 22px rgba(108, 92, 231, .45);
    flex: 0 0 auto;
  }
  .logo svg { width: 22px; height: 22px; }

  .brand h1 {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .3px;
  }
  .brand h1 span {
    background: linear-gradient(90deg, var(--brand-1), var(--brand-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand small {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: .5px;
    text-transform: uppercase;
  }

  .search-wrap { padding: 0 14px 12px; }

  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 12px;
    transition: border-color .2s, box-shadow .2s;
  }
  .search:focus-within {
    border-color: rgba(108, 92, 231, .7);
    box-shadow: 0 0 0 3px rgba(108, 92, 231, .15);
  }
  .search svg { width: 16px; height: 16px; stroke: var(--muted); flex: 0 0 auto; }
  .search input {
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 13.5px;
    width: 100%;
    font-family: inherit;
  }
  .search input::placeholder { color: var(--muted); }

  .list-label {
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 4px 20px 8px;
    font-weight: 700;
  }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 12px;
  }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 11px 12px;
    border: 1px solid transparent;
    border-radius: 14px;
    background: transparent;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
    transition: background .18s, border-color .18s, transform .18s;
  }
  .chat-item:hover { background: var(--panel-2); }
  .chat-item.active {
    background: linear-gradient(90deg, rgba(108, 92, 231, .18), rgba(0, 210, 255, .07));
    border-color: rgba(108, 92, 231, .45);
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .5px;
    color: #fff;
    flex: 0 0 auto;
    position: relative;
  }
  .avatar .dot {
    position: absolute;
    right: -1px;
    bottom: -1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--online);
    border: 2.5px solid var(--panel);
  }

  .chat-meta { flex: 1; min-width: 0; }
  .chat-meta .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .chat-meta h3 {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-meta .time { font-size: 11px; color: var(--muted); flex: 0 0 auto; }
  .chat-meta p {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .badge {
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
  }

  /* ---------- Chat area ---------- */
  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background:
      radial-gradient(600px 300px at 100% 0%, rgba(108, 92, 231, .10), transparent 70%),
      var(--panel);
  }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(18, 21, 29, .85);
    backdrop-filter: blur(8px);
  }

  .back-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    flex: 0 0 auto;
  }
  .back-btn svg { width: 16px; height: 16px; stroke: var(--text); }

  .chat-header .info { flex: 1; min-width: 0; }
  .chat-header h2 { font-size: 15.5px; font-weight: 650; }
  .chat-header .status {
    font-size: 12px;
    color: var(--online);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  .chat-header .status .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--online);
    box-shadow: 0 0 0 0 rgba(46, 204, 113, .6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
    100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: .2s;
  }
  .icon-btn:hover {
    color: var(--text);
    border-color: rgba(108, 92, 231, .6);
    background: var(--panel-3);
  }
  .icon-btn svg { width: 17px; height: 17px; stroke: currentColor; }

  /* ---------- Messages ---------- */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }

  .day-divider {
    align-self: center;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 6px;
  }

  .msg {
    display: flex;
    max-width: 100%;
    animation: pop .22s ease-out;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg .bubble {
    max-width: min(72%, 520px);
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.45;
    position: relative;
    word-wrap: break-word;
  }
  .msg .bubble p { white-space: pre-wrap; }

  .msg .bubble .time {
    display: block;
    font-size: 10.5px;
    margin-top: 4px;
    opacity: .65;
    text-align: right;
  }

  .msg.in { justify-content: flex-start; }
  .msg.in .bubble {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-bottom-left-radius: 5px;
  }

  .msg.out { justify-content: flex-end; }
  .msg.out .bubble {
    background: linear-gradient(135deg, var(--brand-1), #4b7bec);
    border-bottom-right-radius: 5px;
    box-shadow: 0 8px 20px rgba(108, 92, 231, .28);
  }

  /* Typing indicator */
  .typing {
    display: none;
    align-items: center;
    gap: 5px;
    padding: 12px 16px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 16px;
    border-bottom-left-radius: 5px;
    width: fit-content;
  }
  .typing.show { display: flex; animation: pop .2s ease-out; }
  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.3s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink {
    0%, 60%, 100% { opacity: .3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }

  /* ---------- Composer ---------- */
  .composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 14px 16px 18px;
    border-top: 1px solid var(--line);
    background: rgba(18, 21, 29, .9);
  }

  .composer .field {
    flex: 1;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 8px 8px 8px 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  .composer .field:focus-within {
    border-color: rgba(108, 92, 231, .7);
    box-shadow: 0 0 0 3px rgba(108, 92, 231, .13);
  }

  .composer textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.45;
    max-height: 120px;
    padding: 6px 0;
  }
  .composer textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    flex: 0 0 auto;
    transition: transform .15s, box-shadow .2s, opacity .2s;
    box-shadow: 0 10px 24px rgba(108, 92, 231, .4);
  }
  .send-btn:hover { transform: translateY(-1px) scale(1.03); }
  .send-btn:active { transform: scale(.96); }
  .send-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .send-btn svg { width: 19px; height: 19px; }

  /* ---------- Scrollbars ---------- */
  .chat-list::-webkit-scrollbar,
  .messages::-webkit-scrollbar { width: 8px; }
  .chat-list::-webkit-scrollbar-thumb,
  .messages::-webkit-scrollbar-thumb {
    background: #2a3242;
    border-radius: 99px;
  }
  .chat-list::-webkit-scrollbar-thumb:hover,
  .messages::-webkit-scrollbar-thumb:hover { background: #3a4459; }
  .chat-list::-webkit-scrollbar-track,
  .messages::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Mobile ---------- */
  @media (max-width: 820px) {
    body { padding: 0; }
    .app {
      height: 100dvh;
      width: 100%;
      border: none;
      border-radius: 0;
    }
    .sidebar { width: 100%; flex: 1 1 100%; border-right: none; }
    .chat { display: none; }
    .back-btn { display: flex; }
    .app.chat-open .sidebar { display: none; }
    .app.chat-open .chat { display: flex; width: 100%; }
    .msg .bubble { max-width: 82%; }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </div>
      <div>
        <h1>Dabz<span>Chat</span></h1>
        <small>Stay connected</small>
      </div>
    </div>

    <div class="search-wrap">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search chats..." autocomplete="off" />
      </label>
    </div>

    <div class="list-label">Messages</div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <!-- ============ CHAT ============ -->
  <main class="chat">
    <header class="chat-header">
      <button class="back-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>

      <div class="avatar" id="headerAvatar"></div>

      <div class="info">
        <h2 id="headerName">Dabz</h2>
        <div class="status" id="headerStatus">
          <span class="pulse"></span><span id="statusText">Online</span>
        </div>
      </div>

      <button class="icon-btn" aria-label="Voice call" title="Voice call">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </button>

      <button class="icon-btn" aria-label="Video call" title="Video call">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m23 7-7 5 7 5V7z"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
      </button>
    </header>

    <section class="messages" id="messages"></section>

    <div class="composer">
      <div class="field">
        <textarea id="input" rows="1" placeholder="Type a message..." maxlength="1000"></textarea>
        <button class="icon-btn" id="emojiBtn" aria-label="Emoji" title="Emoji"
                style="width:34px;height:34px;border:none;background:transparent;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line x1="9" y1="9" x2="9.01" y2="9"/>
            <line x1="15" y1="9" x2="15.01" y2="9"/>
          </svg>
        </button>
      </div>

      <button class="send-btn" id="sendBtn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
        </svg>
      </button>
    </div>
  </main>
</div>

<script>
/* =========================================================
   DabzChat — demo logic (vanilla JS)
   ========================================================= */

const nowTime = () =>
  new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

/* ---------- Data ---------- */
const contacts = [
  {
    id: 'dabz',
    name: 'Dabz',
    initials: 'DZ',
    color: 'linear-gradient(135deg,#6c5ce7,#00d2ff)',
    online: true,
    unread: 0,
    messages: [
      { from: 'them', text: 'Hey! Welcome to DabzChat 👋', time: '09:41' },
      { from: 'them', text: 'This is where all your conversations live.', time: '09:41' },
      { from: 'me',   text: 'Looks clean! Did you build this?', time: '09:42' },
      { from: 'them', text: 'Yep — single file, no dependencies 😎', time: '09:43' }
    ],
    replies: [
      'Nice one! 🔥',
      'Totally agree with you there.',
      'Haha, that\'s exactly what I was thinking.',
      'Give me a sec, I\'m checking 👀',
      'Sounds like a plan 👍'
    ]
  },
  {
    id: 'alex',
    name: 'Alex Rivera',
    initials: 'AR',
    color: 'linear-gradient(135deg,#ff7675,#fdcb6e)',
    online: true,
    unread: 2,
    messages: [
      { from: 'them', text: 'Are we still on for tomorrow?', time: '08:12' },
      { from: 'me',   text: 'Yes! 10am works for me.', time: '08:20' },
      { from: 'them', text: 'Perfect. I\'ll bring the slides 📊', time: '08:21' }
    ],
    replies: [
      'Got it, thanks!',
      'Cool cool, see you then.',
      'Let me double-check and get back to you.',
      'Perfect 👌'
    ]
  },
  {
    id: 'team',
    name: 'Design Team',
    initials: 'DT',
    color: 'linear-gradient(135deg,#00b894,#00cec9)',
    online: false,
    unread: 0,
    messages: [
      { from: 'them', text: 'New mockups are in the shared folder.', time: 'Yesterday' },
      { from: 'me',   text: 'Awesome, I\'ll review them today.', time: 'Yesterday' }
    ],
    replies: [
      'Thanks for the update!',
      'Noted — will follow up shortly.',
      'Great, keep me posted.'
    ]
  },
  {
    id: 'maya',
    name: 'Maya Chen',
    initials: 'MC',
    color: 'linear-gradient(135deg,#a29bfe,#fd79a8)',
    online: true,
    unread: 1,
    messages: [
      { from: 'them', text: 'Sent you the playlist 🎧', time: 'Yesterday' },
      { from: 'me',   text: 'You\'re the best!', time: 'Yesterday' }
    ],
    replies: [
      'Haha 😄',
      'Ooh nice, tell me more.',
      'I\'ll send it over in a bit.',
      'Yesss! 🙌'
    ]
  },
  {
    id: 'sam',
    name: 'Sam Okafor',
    initials: 'SO',
    color: 'linear-gradient(135deg,#0984e3,#74b9ff)',
    online: false,
    unread: 0,
    messages: [
      { from: 'them', text: 'Deploy went through ✅', time: 'Mon' },
      { from: 'me',   text: 'Legend. Thanks Sam!', time: 'Mon' }
    ],
    replies: [
      'All good on my end.',
      'Will do 👍',
      'Let me know if anything breaks.',
      'Nice work!'
    ]
  }
];

/* ---------- Element refs ---------- */
const appEl        = document.getElementById('app');
const chatListEl   = document.getElementById('chatList');
const messagesEl   = document.getElementById('messages');
const headerAvatar = document.getElementById('headerAvatar');
const headerName   = document.getElementById('headerName');
const statusText   = document.getElementById('statusText');
const headerStatus = document.getElementById('headerStatus');
const inputEl      = document.getElementById('input');
const sendBtn      = document.getElementById('sendBtn');
const backBtn      = document.getElementById('backBtn');
const searchInput  = document.getElementById('searchInput');
const emojiBtn     = document.getElementById('emojiBtn');

let activeId = contacts[0].id;
const replyIndex = {};       // per-contact reply cursor

const getContact = (id) => contacts.find(c => c.id === id);

/* ---------- Rendering: chat list ---------- */
function renderChatList(filter = '') {
  chatListEl.innerHTML = '';

  const q = filter.trim().toLowerCase();
  const visible = contacts.filter(c =>
    c.name.toLowerCase().includes(q) ||
    c.messages.some(m => m.text.toLowerCase().includes(q))
  );

  if (!visible.length) {
    const empty = document.createElement('p');
    empty.style.cssText = 'color:var(--muted);font-size:13px;padding:16px;text-align:center;';
    empty.textContent = 'No chats found';
    chatListEl.appendChild(empty);
    return;
  }

  visible.forEach(c => {
    const last = c.messages[c.messages.length - 1];

    const btn = document.createElement('button');
    btn.className = 'chat-item' + (c.id === activeId ? ' active' : '');
    btn.type = 'button';

    const av = document.createElement('div');
    av.className = 'avatar';
    av.style.background = c.color;
    av.textContent = c.initials;
    if (c.online) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      av.appendChild(dot);
    }

    const meta = document.createElement('div');
    meta.className = 'chat-meta';

    const row = document.createElement('div');
    row.className = 'row';

    const name = document.createElement('h3');
    name.textContent = c.name;

    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = last ? last.time : '';

    row.append(name, time);

    const preview = document.createElement('p');
    preview.textContent = last
      ? (last.from === 'me' ? 'You: ' : '') + last.text
      : 'Say hi 👋';

    meta.append(row, preview);
    btn.append(av, meta);

    if (c.unread > 0) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = c.unread;
      btn.appendChild(badge);
    }

    btn.addEventListener('click', () => openChat(c.id));
    chatListEl.appendChild(btn);
  });
}

/* ---------- Rendering: header ---------- */
function renderHeader(contact) {
  headerAvatar.style.background = contact.color;
  headerAvatar.textContent = contact.initials;
  headerName.textContent = contact.name;
  statusText.textContent = contact.online ? 'Online' : 'Last seen recently';
  headerStatus.style.color = contact.online ? 'var(--online)' : 'var(--muted)';
  headerStatus.querySelector('.pulse').style.display = contact.online ? 'block' : 'none';
}

/* ---------- Rendering: messages ---------- */
function buildMessage(msg) {
  const row = document.createElement('div');
  row.className = 'msg ' + (msg.from === 'me' ? 'out' : 'in');

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const p = document.createElement('p');
  p.textContent = msg.text;

  const t = document.createElement('span');
  t.className = 'time';
  t.textContent = msg.time;

  bubble.append(p, t);
  row.appendChild(bubble);
  return row;
}

function renderMessages(contact) {
  messagesEl.innerHTML = '';

  const divider = document.createElement('div');
  divider.className = 'day-divider';
  divider.textContent = 'Today';
  messagesEl.appendChild(divider);

  contact.messages.forEach(m => messagesEl.appendChild(buildMessage(m)));

  // typing indicator (kept at the bottom)
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.id = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(typing);

  scrollToBottom();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

/* ---------- Open chat ---------- */
function openChat(id) {
  activeId = id;
  const contact = getContact(id);
  if (!contact) return;

  contact.unread = 0;             // mark as read
  renderChatList(searchInput.value);
  renderHeader(contact);
  renderMessages(contact);
  appEl.classList.add('chat-open'); // mobile: switch views

  inputEl.value = '';
  inputEl.style.height = 'auto';
  inputEl.focus();
}

/* ---------- Sending ---------- */
function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  const contact = getContact(activeId);
  if (!contact) return;

  contact.messages.push({ from: 'me', text, time: nowTime() });

  // append only the new bubble (keeps it snappy)
  const typingEl = document.getElementById('typing');
  const bubble = buildMessage(contact.messages[contact.messages.length - 1]);
  messagesEl.insertBefore(bubble, typingEl);

  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = false;
  scrollToBottom();
  renderChatList(searchInput.value);

  simulateReply(contact);
}

function simulateReply(contact) {
  const typingEl = document.getElementById('typing');
  if (!typingEl) return;

  const delay = 700 + Math.random() * 900;

  setTimeout(() => {
    if (activeId === contact.id) {
      typingEl.classList.add('show');
      scrollToBottom();
    }

    setTimeout(() => {
      const pool = contact.replies;
      const i = (replyIndex[contact.id] || 0) % pool.length;
      replyIndex[contact.id] = i + 1;

      contact.messages.push({ from: 'them', text: pool[i], time: nowTime() });

      if (activeId === contact.id) {
        typingEl.classList.remove('show');
        messagesEl.insertBefore(
          buildMessage(contact.messages[contact.messages.length - 1]),
          typingEl
        );
        scrollToBottom();
      }
      renderChatList(searchInput.value);
    }, 900 + Math.random() * 700);
  }, delay);
}

/* ---------- Events ---------- */
sendBtn.addEventListener('click', sendMessage);

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  sendBtn.disabled = inputEl.value.trim().length === 0;
});

backBtn.addEventListener('click', () => appEl.classList.remove('chat-open'));

searchInput.addEventListener('input', (e) => renderChatList(e.target.value));

const emojis = ['😀', '😂', '😍', '🔥', '👍', '🎉', '😎', '🙌', '💯', '❤️'];
emojiBtn.addEventListener('click', () => {
  const e = emojis[Math.floor(Math.random() * emojis.length)];
  inputEl.value += e;
  inputEl.focus();
  sendBtn.disabled = false;
});

/* ---------- Boot ---------- */
renderChatList();
openChat(activeId);
appEl.classList.remove('chat-open'); // start on the list when on mobile
sendBtn.disabled = true;
</script>

</body>
</html>
