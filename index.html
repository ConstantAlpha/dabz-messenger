<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dabz</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;margin:0;padding:20px}
input,button{padding:12px;border-radius:10px;border:none;width:100%;margin:5px 0;font-size:16px}
button{background:#22c55e;font-weight:bold}
#chat{display:none}
#msgs{height:60vh;overflow:auto;background:#1e293b;padding:10px;border-radius:10px}
.msg{background:#334155;padding:8px;margin:5px 0;border-radius:8px}
</style>
</head>
<body>
<div id="login">
<h1>Dabz 💬</h1>
<input id="nameInput" placeholder="Your name">
<button onclick="join()">Enter Dabz</button>
<p id="err" style="color:#f87171"></p>
</div>
<div id="chat">
<h2 id="welcome"></h2>
<div id="msgs"></div>
<input id="msgInput" placeholder="Type message...">
<button onclick="sendMsg()">Send</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCXPDgHPp9fCkunGFi2607wDGwh5hIVzf4",
  authDomain: "dabz-6c525.firebaseapp.com",
  projectId: "dabz-6c525",
  storageBucket: "dabz-6c525.firebasestorage.app",
  messagingSenderId: "1075617125423",
  appId: "1:1075617125423:web:e484dc36b9dc18d26a62da"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let myName = "";
window.join = function(){
  const n = document.getElementById("nameInput").value.trim();
  if(!n){ document.getElementById("err").innerText = "Type your name first"; return; }
  myName = n;
  document.getElementById("login").style.display="none";
  document.getElementById("chat").style.display="block";
  document.getElementById("welcome").innerText = "Hi " + myName;
  const q = query(collection(db,"messages"), orderBy("time","asc"));
  onSnapshot(q, (snap)=>{
    const box = document.getElementById("msgs");
    box.innerHTML="";
    snap.forEach(d=>{
      const m = d.data();
      box.innerHTML += `<div class="msg"><b>${m.name}:</b> ${m.text}</div>`;
    });
    box.scrollTop = box.scrollHeight;
  });
};
window.sendMsg = async function(){
  const t = document.getElementById("msgInput").value.trim();
  if(!t) return;
  await addDoc(collection(db,"messages"), {name: myName, text: t, time: serverTimestamp()});
  document.getElementById("msgInput").value="";
};
</script>
</body>
</html>
