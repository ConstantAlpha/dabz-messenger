<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dabz Messenger - by Constant</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6C00FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
* { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
body { background: #f0f2f5; margin: 0; padding: 0; }
.header { background: #6C00FF; color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
.header b { font-size: 22px; letter-spacing: 1px; }
.header b span { color: #FFD700; }
.header button { background: rgba(255,255,255,0.2); color: white; border: none; padding: 7px 10px; border-radius: 20px; cursor: pointer; font-size: 12px; }
.container { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; }
.login { padding: 30px 20px; text-align: center; }
.login h1 { font-size: 36px; margin: 10px 0 5px; color: #6C00FF; }
.login h1 span { color: #FFD700; }
.login p { color: #666; font-size: 14px; }
.login input, .login select { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; }
.join { width: 100%; background: #6C00FF; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px; }
.rooms { display: flex; gap: 6px; overflow-x: auto; padding: 10px; background: #f8f9fa; }
.room { white-space: nowrap; padding: 9px 14px; border: 1px solid #ddd; border-radius: 20px; background: white; cursor: pointer; font-size: 14px; }
.room.active { background: #6C00FF; color: white; border-color: #6C00FF; }
.online { padding: 8px 12px; font-size: 12px; color: #28a745; background: #e8f5e9; }
#messages { height: 55vh; overflow-y: auto; background: #ece5dd; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 82%; padding: 10px 12px; border-radius: 14px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
.msg.mine { align-self: flex-end; background: #E6D6FF; border-bottom-right-radius: 2px; }
.msg.other { align-self: flex-start; background: white; border-bottom-left-radius: 2px; }
.msg b { display: block; font-size: 12px; color: #6C00FF; }
.msg span { font-size: 11px; color: #999; display: block; text-align: right; margin-top: 4px; }
.input-area { display: flex; gap: 8px; padding: 10px; background: white; position: sticky; bottom: 0; }
.input-area input { flex: 1; padding: 13px; border: 1px solid #ddd; border-radius: 25px; font-size: 15px; }
.input-area button { background: #6C00FF; color: white; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.footer { text-align: center; color: #999; font-size: 11px; padding: 10px; }
.empty { text-align: center; color: #888; padding: 40px 10px; }
.emoji-bar { display: flex; gap: 8px; padding: 0 10px 8px; overflow-x: auto; }
.emoji-bar span { font-size: 22px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><b>DABZ<span>💬</span></b><span id="whoAmI" style="font-size:13px;"></span><button onclick="switchUser()">Switch 🔄</button></div>

  <div id="loginBox" class="login">
    <div style="font-size:60px;">💬</div>
    <h1>DABZ<span> Messenger</span></h1>
    <p>Chat fast. Chat free. Made in Busia by Constant.</p>
    <input type="text" id="myName" placeholder="Your Dabz name e.g. Constant">
    <select id="myAvatar">
      <option value="😎">😎 Cool</option>
      <option value="🔥">🔥 Fire</option>
      <option value="🦁">🦁 Lion</option>
      <option value="👩‍🎓">👩‍🎓 Student Girl</option>
      <option value="👨‍💻">👨‍💻 Coder</option>
      <option value="🎧">🎧 Music</option>
      <option value="⚽">⚽ Football</option>
    </select>
    <button class="join" onclick="joinDabz()">Enter Dabz →</button>
    <p style="font-size:12px; margin-top:15px;">Tip: Open in 2 tabs - Join as Constant in one, Kevin in the other to test.</p>
  </div>

  <div id="chatBox" style="display:none;">
    <div class="online">🟢 <span id="onlineCount">1</span> online now in Dabz • Busia, Kenya</div>
    <div class="rooms">
      <button class="room active" onclick="setRoom('General')">💬 General</button>
      <button class="room" onclick="setRoom('Busia')">🏠 Busia</button>
      <button class="room" onclick="setRoom('UoPeople CS')">🎓 UoPeople CS</button>
      <button class="room" onclick="setRoom('Music')">🎵 Music</button>
      <button class="room" onclick="setRoom('Football')">⚽ Football</button>
    </div>
    <div id="messages"></div>
    <div class="emoji-bar">
      <span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('🙏')">🙏</span><span onclick="addEmoji('🎉')">🎉</span><span onclick="addEmoji('😭')">😭</span>
    </div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Type a Dabz message..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>
  <p class="footer">Dabz Messenger © 2026 • Built by Constant in Busia, Kenya<br><a href="https://ConstantAlpha.github.io/brian-portfolio/">Back to Portfolio</a></p>
</div>

<script>
// ⬇️ PASTE YOUR SAME FIREBASE CONFIG FROM UoPeople Chat HERE ⬇️
const firebaseConfig = {
  apiKey: "PASTE-YOUR-API-KEY-HERE",
  authDomain: "PASTE-YOUR-PROJECT.firebaseapp.com",
  databaseURL: "https://PASTE-YOUR-PROJECT-default-rtdb.firebaseio.com",
  projectId: "PASTE-YOUR-PROJECT",
  storageBucket: "PASTE-YOUR-PROJECT.appspot.com",
  messagingSenderId: "PASTE-YOUR-ID",
  appId: "PASTE-YOUR-APP-ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const messagesRef = db.ref('dabz_messages');

let currentUser = localStorage.getItem('dabz_name') || '';
let currentAvatar = localStorage.getItem('dabz_avatar') || '😎';
let currentRoom = 'General';
let allMessages = [];

function joinDabz() {
  let name = document.getElementById('myName').value.trim();
  if (!name) { alert('Enter your Dabz name'); return; }
  currentUser = name; currentAvatar = document.getElementById('myAvatar').value;
  localStorage.setItem('dabz_name', currentUser); localStorage.setItem('dabz_avatar', currentAvatar);
  showChat();
}
function showChat() {
  if (!currentUser) return;
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('chatBox').style.display = 'block';
  document.getElementById('whoAmI').textContent = currentAvatar + ' ' + currentUser;
  listenToMessages();
}
function switchUser() {
  currentUser = currentUser === 'Constant' ? 'Kevin' : 'Constant';
  localStorage.setItem('dabz_name', currentUser); showChat();
}
function setRoom(room) {
  currentRoom = room;
  document.querySelectorAll('.room').forEach(b => b.classList.toggle('active', b.textContent.includes(room)));
  render();
}
function addEmoji(e) { document.getElementById('msgInput').value += e; document.getElementById('msgInput').focus(); }
function sendMsg() {
  let input = document.getElementById('msgInput');
  let text = input.value.trim(); if (!text) return;
  messagesRef.push({ user: currentUser, avatar: currentAvatar, room: currentRoom, text: text, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), timestamp: Date.now() });
  input.value = '';
}
function listenToMessages() {
  messagesRef.orderByChild('timestamp').on('value', (snapshot) => {
    allMessages = [];
    snapshot.forEach(child => { let m = child.val(); m.key = child.key; allMessages.push(m); });
    render();
  });
}
function render() {
  let box = document.getElementById('messages');
  let filtered = allMessages.filter(m => m.room === currentRoom);
  document.getElementById('onlineCount').textContent = Math.max(1, new Set(allMessages.map(m => m.user)).size);
  if (filtered.length === 0) { box.innerHTML = '<div class="empty">No Dabz in ' + currentRoom + ' yet.<br>Be the first! Say Hi 👋</div>'; return; }
  box.innerHTML = filtered.map(m => `<div class="msg ${m.user === currentUser ? 'mine' : 'other'}"><b>${m.avatar} ${m.user}</b>${m.text}<span>${m.time}</span></div>`).join('');
  box.scrollTop = box.scrollHeight;
}
if (currentUser) { document.getElementById('myName').value = currentUser; showChat(); }
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
